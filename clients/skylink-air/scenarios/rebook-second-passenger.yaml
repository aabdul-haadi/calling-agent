id: rebook-second-passenger
title: Different passenger completes a rebooking in fewer messages
persona: Daniel Okafor, booking SK1002, direct and brief
turns:
  - Hi, I am Okafor, booking SK1002. My flight got cancelled, what are my options?
  - The earliest one works, please rebook me
  - Yes, I confirm. Please go ahead and book it.
expectedTools:
  - verify_customer
  - search_alternatives
  - change_flight
expectHandoff: false
expectedOutcome: Agent verifies, lists alternatives, rebooks the earliest after explicit
  confirmation, and confirms the new flight.
