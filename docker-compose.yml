services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: adk
      POSTGRES_PASSWORD: adk
      POSTGRES_DB: adk
    ports:
      - '5432:5432'
    volumes:
      - adk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adk -d adk']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  adk-pgdata:
