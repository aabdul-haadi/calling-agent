id: duplicate-rebooking
title: Asking twice never double-books
persona: Elena Lindqvist, SK1003, anxious and repeats herself
turns:
  - I am Lindqvist, booking SK1003, my flight was cancelled. What are my options?
  - Book me on the first option
  - Yes, I confirm. Please go ahead and book it.
  - Please book it again to be safe, same flight
maxToolSuccesses:
  change_flight: 1
expectedTools:
  - verify_customer
  - search_alternatives
  - change_flight
expectedOutcome: Agent rebooks once, and when asked again explains the booking is already changed
  without making a second change.
