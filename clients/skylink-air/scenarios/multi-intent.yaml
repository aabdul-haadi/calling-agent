id: multi-intent
title: Handles rebooking and a baggage question in one message
persona: Daniel Lindqvist, SK1003, asks two things
turns:
  - I am Lindqvist, booking SK1003. My flight was cancelled and also how many checked bags can I
    bring?
expectedTools:
  - verify_customer
  - get_booking
expectedOutcome: 'Agent addresses both: looks up the cancelled flight and states the checked baggage
  allowance from policy (1 bag in Economy, 23 kg) with a source.'
